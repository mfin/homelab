app-template:
  controllers:
    main:
      annotations:
        reloader.stakater.com/auto: "true"
      type: statefulset
      replicas: 1
      containers:
        main:
          image:
            repository: ghcr.io/dani-garcia/vaultwarden
            tag: 1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
          env:
            DOMAIN: https://vault.mfin.app
            TZ: Europe/Ljubljana
            SIGNUPS_ALLOWED: false
            WEBSOCKET_ENABLED: true
          envFrom:
            - secretRef:
                name: vaultwarden-secret
      pod:
        securityContext:
          fsGroup: 100
          fsGroupChangePolicy: "OnRootMismatch"
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            memory: 500Mi
  service:
    main:
      ports:
        http:
          port: 80
  route:
    main:
      hostnames:
        - vault.mfin.app
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
  persistence:
    data:
      enabled: true
      existingClaim: vaultwarden
