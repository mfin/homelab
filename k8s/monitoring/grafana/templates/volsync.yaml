{{- /* VolSync disabled by default. Set volsync.enabled=true in values to re-enable. */ -}}
{{- if and .Values.volsync .Values.volsync.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-restic-secret
type: Opaque
stringData:
  RESTIC_REPOSITORY: '{{ .Values.volsync.repository }}/grafana'
  RESTIC_PASSWORD: '{{ .Values.volsync.password }}'
  AWS_ACCESS_KEY_ID: '{{ .Values.volsync.accessKey }}'
  AWS_SECRET_ACCESS_KEY: '{{ .Values.volsync.secretKey }}'
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: grafana
spec:
  paused: true
  sourcePVC: grafana
  trigger:
    schedule: "0 0 * * *"
  restic:
    copyMethod: Clone
    pruneIntervalDays: 10
    repository: grafana-restic-secret
    storageClassName: local-hostpath
    volumeSnapshotClassName: local-hostpath
    cacheCapacity: 2Gi
    moverSecurityContext:
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
    retain:
      daily: 10
      within: 3d
{{- end }}
