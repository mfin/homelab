# The ACME email is only accepted as a literal string, so ESO renders the
# whole Issuer from Bitwarden (generic target) instead of Helm templating it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: letsencrypt-issuer
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: letsencrypt-issuer
    manifest:
      apiVersion: cert-manager.io/v1
      kind: Issuer
    template:
      engineVersion: v2
      templateFrom:
        - target: Spec
          literal: |
            acme:
              email: "{{ `{{ .email }}` }}"
              server: https://acme-v02.api.letsencrypt.org/directory
              privateKeySecretRef:
                name: le-issuer-account-key
              solvers:
                - dns01:
                    webhook:
                      groupName: acme.pr0ton11.github.com
                      solverName: desec
                      config:
                        apiKeySecretRef:
                          name: desec-token
                          key: token
  data:
    - secretKey: email
      remoteRef:
        key: DESEC_EMAIL
---
# ESO's controller needs permission to manage the generated Issuer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-issuers
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-issuers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-issuers
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
