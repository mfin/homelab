apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: desec-token
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: desec-token
    template:
      data:
        token: "{{ `{{ .token }}` }}"
  data:
    - secretKey: token
      remoteRef:
        key: DESEC_TOKEN
