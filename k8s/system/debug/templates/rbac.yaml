apiVersion: v1
kind: ServiceAccount
metadata:
  name: debug
---
# Full cluster-admin: a shell in this pod can do anything in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: debug-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: debug
    namespace: {{ .Release.Namespace }}
