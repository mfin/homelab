apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: debug
  template:
    metadata:
      labels:
        app.kubernetes.io/name: debug
    spec:
      serviceAccountName: debug
      terminationGracePeriodSeconds: 1
      containers:
        - name: debug
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 512Mi
